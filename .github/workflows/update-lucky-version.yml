name: Update Lucky Version

on:
  schedule:
    # Run every Sunday at 05:00 China time.
    - cron: "0 21 * * 6"
  workflow_dispatch:
    inputs:
      include_prerelease:
        description: Include beta release directories
        required: false
        default: "true"
      openwrt_release:
        description: OpenWrt release version
        required: true
        default: "25.12.2"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: update-lucky-version
  # Finish merging and publishing before another updater starts.
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.latest.outputs.package_version }}
      release_dir: ${{ steps.latest.outputs.release_dir }}
      file_version: ${{ steps.latest.outputs.file_version }}
      upstream_url: ${{ steps.latest.outputs.url }}
      built_sha: ${{ steps.update_pr.outputs.commit_sha }}
      merge_commit: ${{ steps.merge.outputs.merge_commit }}
    env:
      RELEASE_BASE: https://release.66666.host
      LUCKY_VARIANT: lucky
      INCLUDE_PRERELEASE: ${{ github.event.inputs.include_prerelease || 'true' }}
      OPENWRT_RELEASE: ${{ github.event.inputs.openwrt_release || '25.12.2' }}
      OPENWRT_TARGET: x86
      OPENWRT_SUBTARGET: "64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test automatic review and merge boundaries
        run: python3 .github/scripts/test_review_lucky_update.py

      - name: Resolve latest upstream release
        id: latest
        shell: bash
        run: |
          set -euo pipefail

          python3 - "${RELEASE_BASE}" "${LUCKY_VARIANT}" "${INCLUDE_PRERELEASE}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import re
          import sys
          import urllib.parse
          import urllib.request
          import uuid
          from html.parser import HTMLParser


          class DirectoryLinks(HTMLParser):
              """Read immediate file links from the upstream HTML directory listing."""

              def __init__(self):
                  super().__init__()
                  self.items = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag != "a" or "file-link" not in attrs.get("class", "").split():
                      return
                  match = re.fullmatch(r"\./([^/?#]+)(/?)", attrs.get("href", ""))
                  if not match:
                      return
                  name = urllib.parse.unquote(match[1])
                  if name in (".", "..") or "/" in name or "\\" in name:
                      return
                  self.items.append({"name": name, "is_dir": bool(match[2])})


          def fetch_directory(url):
              # The CDN may serve cached HTML even when Accept requests JSON. Give each
              # directory request a fresh cache key, including nested release directories.
              request_url = f"{url}?lucky_sync={uuid.uuid4().hex}"
              request = urllib.request.Request(
                  request_url,
                  headers={"Accept": "application/json", "Cache-Control": "no-cache"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read().decode("utf-8-sig")
                  content_type = response.headers.get("Content-Type", "unknown")

              try:
                  items = json.loads(body)
              except json.JSONDecodeError:
                  parser = DirectoryLinks()
                  parser.feed(body)
                  items = parser.items
                  if not items:
                      raise ValueError(
                          f"Upstream directory {url} returned {content_type}, "
                          "with neither valid JSON nor supported HTML file links"
                      ) from None
                  print(f"Upstream returned HTML for {url}; using directory links", file=sys.stderr)

              if not isinstance(items, list) or any(
                  not isinstance(item, dict)
                  or not isinstance(item.get("name"), str)
                  or not isinstance(item.get("is_dir"), bool)
                  for item in items
              ):
                  raise ValueError(f"Invalid upstream directory listing at {url}")
              return items


          def release_key(name, include_prerelease):
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:beta(\d*))?", name)
              if not match:
                  return None
              major, minor, patch = map(int, match.groups()[:3])
              beta_no = match[4]
              if beta_no is None:
                  return major, minor, patch, 1, 0
              if include_prerelease:
                  return major, minor, patch, 0, int(beta_no or 0)
              return None


          def resolve_release(release_base, variant, include_prerelease):
              release_base = release_base.rstrip("/")
              candidates = []
              for item in fetch_directory(f"{release_base}/"):
                  key = release_key(item["name"], include_prerelease)
                  if item["is_dir"] and key is not None:
                      candidates.append((key, item["name"]))
              if not candidates:
                  raise ValueError("No matching Lucky release directories found")

              _, release_dir = max(candidates)
              package_version = re.sub(r"beta(\d*)$", r"_beta\1", release_dir[1:])
              release_items = fetch_directory(f"{release_base}/{release_dir}/")
              variant_suffix = f"_{variant}"
              variant_dir = next(
                  (item["name"] for item in release_items
                   if item["is_dir"] and item["name"].endswith(variant_suffix)),
                  None,
              )
              if not variant_dir:
                  raise ValueError(f"Release {release_dir} does not include variant {variant}")

              file_version = variant_dir[:-len(variant_suffix)]
              url = f"{release_base}/{release_dir}/{variant_dir}/"
              assets = {item["name"] for item in fetch_directory(url) if not item["is_dir"]}
              archive_suffix = "" if variant == "lucky" else f"_{variant}"
              archive = f"lucky_{file_version}_Linux_x86_64{archive_suffix}.tar.gz"
              if archive not in assets:
                  raise ValueError(
                      "Latest Lucky release is missing package assets used by lucky/Makefile: "
                      + archive
                  )

              return {
                  "package_version": package_version,
                  "release_dir": release_dir,
                  "file_version": file_version,
                  "variant": variant,
                  "url": url,
              }


          def main():
              if len(sys.argv) != 4 or sys.argv[3] not in ("true", "false"):
                  raise SystemExit("Expected RELEASE_BASE VARIANT true|false")
              try:
                  metadata = resolve_release(sys.argv[1], sys.argv[2], sys.argv[3] == "true")
              except (ValueError, OSError) as exc:
                  raise SystemExit(f"Failed to resolve Lucky release: {exc}") from None
              for key, value in metadata.items():
                  print(f"{key}={value}")


          if __name__ == "__main__":
              main()
          PY

      - name: Update package version
        id: update
        shell: bash
        run: |
          set -euo pipefail

          current_package_version="$(sed -n 's/^PKG_VERSION:=//p' lucky/Makefile | head -n1)"
          current_release_dir="$(sed -n 's/^LUCKY_RELEASE_DIR:=//p' lucky/Makefile | head -n1)"
          current_file_version="$(sed -n 's/^LUCKY_FILE_VERSION:=//p' lucky/Makefile | head -n1)"
          current_variant="$(sed -n 's/^LUCKY_VARIANT:=//p' lucky/Makefile | head -n1)"

          package_version="${{ steps.latest.outputs.package_version }}"
          release_dir="${{ steps.latest.outputs.release_dir }}"
          file_version="${{ steps.latest.outputs.file_version }}"
          variant="${{ steps.latest.outputs.variant }}"

          echo "current=${current_package_version}" >> "${GITHUB_OUTPUT}"
          echo "latest=${package_version}" >> "${GITHUB_OUTPUT}"

          if [[ "${current_package_version}" == "${package_version}" ]] && \
             [[ "${current_release_dir}" == "${release_dir}" ]] && \
             [[ "${current_file_version}" == "${file_version}" ]] && \
             [[ "${current_variant}" == "${variant}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          sed -i -E \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${package_version}/" \
            -e "s|^LUCKY_RELEASE_DIR:=.*|LUCKY_RELEASE_DIR:=${release_dir}|" \
            -e "s/^LUCKY_FILE_VERSION:=.*/LUCKY_FILE_VERSION:=${file_version}/" \
            -e "s/^LUCKY_VARIANT:=.*/LUCKY_VARIANT:=${variant}/" \
            lucky/Makefile
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Create update pull request
        id: update_pr
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LUCKY_VERSION: ${{ steps.latest.outputs.package_version }}
          LUCKY_RELEASE_DIR: ${{ steps.latest.outputs.release_dir }}
          LUCKY_FILE_VERSION: ${{ steps.latest.outputs.file_version }}
          LUCKY_VARIANT: ${{ steps.latest.outputs.variant }}
          LUCKY_URL: ${{ steps.latest.outputs.url }}
        run: |
          set -euo pipefail

          branch="automation/update-lucky-${LUCKY_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add lucky/Makefile
          git commit -m "chore: update lucky to ${LUCKY_VERSION}"
          git push --force-with-lease origin "${branch}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

          body="$(mktemp)"
          cat > "${body}" <<EOF
          Updates the Lucky package version to ${LUCKY_VERSION}.

          Source: ${LUCKY_URL}
          Release directory: ${LUCKY_RELEASE_DIR}
          File version: ${LUCKY_FILE_VERSION}
          Variant: ${LUCKY_VARIANT}

          This workflow verified that the release includes all architecture assets referenced by lucky/Makefile before opening this PR.
          EOF

          gh pr view "${branch}" --json number >/dev/null 2>&1 || \
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "${branch}" \
              --title "chore: update lucky to ${LUCKY_VERSION}" \
              --body-file "${body}"
          echo "pr_number=$(gh pr view "${branch}" --json number --jq '.number')" >> "${GITHUB_OUTPUT}"

      - name: Resolve SDK URL
        if: steps.update.outputs.changed == 'true'
        id: sdk
        shell: bash
        run: |
          set -euo pipefail

          sdk_base="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${OPENWRT_TARGET}/${OPENWRT_SUBTARGET}"
          sdk_file="$(
            curl -fsSL "${sdk_base}/" \
              | grep -oE "openwrt-sdk-${OPENWRT_RELEASE}-${OPENWRT_TARGET}-${OPENWRT_SUBTARGET}[^\"']*Linux-x86_64\.tar\.zst" \
              | head -n1
          )"

          if [[ -z "${sdk_file}" ]]; then
            echo "Failed to find SDK under ${sdk_base}" >&2
            exit 1
          fi

          sdk_sha256="$(
            curl -fsSL --retry 3 --connect-timeout 30 --max-time 60 "${sdk_base}/sha256sums" \
              | awk -v filename="${sdk_file}" '$2 == filename || $2 == "*" filename { print $1 }'
          )"
          if [[ ! "${sdk_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Failed to resolve SDK SHA-256 for ${sdk_file}" >&2
            exit 1
          fi

          echo "sdk_base=${sdk_base}" >> "${GITHUB_OUTPUT}"
          echo "sdk_file=${sdk_file}" >> "${GITHUB_OUTPUT}"
          echo "sdk_sha256=${sdk_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        if: steps.update.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            build-essential \
            clang \
            file \
            flex \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            upx-ucl \
            unzip \
            wget \
            zlib1g-dev \
            zstd

      - name: Cache SDK archive
        if: steps.update.outputs.changed == 'true'
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: .cache/openwrt/openwrt-sdk.tar.zst
          key: sdk-${{ env.OPENWRT_RELEASE }}-${{ env.OPENWRT_TARGET }}-${{ env.OPENWRT_SUBTARGET }}-${{ steps.sdk.outputs.sdk_file }}

      - name: Download SDK archive
        if: steps.update.outputs.changed == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .cache/openwrt
          aria2c --max-connection-per-server=8 --split=8 --min-split-size=4M \
            --file-allocation=none --auto-file-renaming=false \
            --connect-timeout=30 --timeout=60 --max-tries=3 --retry-wait=5 \
            --check-integrity=true --checksum="sha-256=${{ steps.sdk.outputs.sdk_sha256 }}" \
            --dir=.cache/openwrt --out=openwrt-sdk.tar.zst \
            "${{ steps.sdk.outputs.sdk_base }}/${{ steps.sdk.outputs.sdk_file }}"

      - name: Extract SDK
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sdk
          tar --zstd -xf .cache/openwrt/openwrt-sdk.tar.zst -C sdk --strip-components=1

      - name: Update feeds
        if: steps.update.outputs.changed == 'true'
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package sources into SDK
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sdk/package/lucky
          cp -r lucky sdk/package/lucky/
          cp -r luci-app-lucky sdk/package/lucky/

      - name: Prepare build configuration
        if: steps.update.outputs.changed == 'true'
        working-directory: sdk
        run: make defconfig

      - name: Build lucky packages
        if: steps.update.outputs.changed == 'true'
        working-directory: sdk
        run: |
          make -j"$(nproc)" package/lucky/lucky/compile V=s
          make -j"$(nproc)" package/lucky/luci-app-lucky/compile V=s

      - name: Collect build artifacts
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          arch="$(find sdk/bin/packages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n1)"
          if [[ -z "${arch}" ]]; then
            echo "Failed to detect package arch under sdk/bin/packages" >&2
            exit 1
          fi
          echo "Detected arch: ${arch}"

          count=0
          while IFS= read -r -d '' file; do
            base="$(basename "${file}")"
            name="${base%.*}"
            ext="${base##*.}"
            cp "${file}" "dist/${name}_${arch}.${ext}"
            count=$((count + 1))
          done < <(find sdk/bin/packages -type f \
            \( -name "lucky-*.apk" -o -name "lucky_*.ipk" \
               -o -name "luci-app-lucky-*.apk" -o -name "luci-app-lucky_*.ipk" \
               -o -name "luci-i18n-lucky-*.apk" -o -name "luci-i18n-lucky-*.ipk" \) \
            -print0)

          if [[ "${count}" -eq 0 ]]; then
            echo "No lucky package artifacts found" >&2
            exit 1
          fi

          ls -lh dist

          max_size=$((25 * 1024 * 1024))
          oversized=0
          while IFS= read -r -d '' file; do
            size="$(stat -c%s "${file}")"
            if (( size > max_size )); then
              echo "${file} is over the Cloudflare Pages 25 MiB file limit (${size} bytes)" >&2
              oversized=1
            fi
          done < <(find dist -type f -print0)
          if (( oversized )); then
            exit 1
          fi

      - name: Upload build artifacts
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lucky-x86_64-${{ steps.latest.outputs.package_version }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

      - name: Validate, approve and merge built version update
        id: merge
        if: success() && steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LUCKY_REVIEW_TOKEN: ${{ secrets.LUCKY_REVIEW_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ steps.update_pr.outputs.pr_number }}
          BUILT_SHA: ${{ steps.update_pr.outputs.commit_sha }}
        run: >-
          python3 .github/scripts/review_lucky_update.py
          --pr "${PR_NUMBER}" --head "${BUILT_SHA}" --local-build --approve --merge

  publish:
    needs: update
    if: needs.update.outputs.merge_commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout merged commit for branch cleanup
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.update.outputs.merge_commit }}

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lucky-x86_64-${{ needs.update.outputs.version }}
          path: dist/

      - name: Publish merged version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.update.outputs.version }}
          target_commitish: ${{ needs.update.outputs.merge_commit }}
          name: Lucky ${{ needs.update.outputs.version }}
          body: |
            Lucky ${{ needs.update.outputs.version }} for OpenWrt x86_64.

            Source: ${{ needs.update.outputs.upstream_url }}
            Release directory: ${{ needs.update.outputs.release_dir }}
            File version: ${{ needs.update.outputs.file_version }}

            Published after the version update passed validation, built successfully and was merged into the default branch.
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: dist/*
          fail_on_unmatched_files: true

      - name: Delete merged update branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.update.outputs.version }}
          BUILT_SHA: ${{ needs.update.outputs.built_sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/update-lucky-${VERSION}"
          ref="repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}"
          if ! gh api "${ref}" --jq '.object.sha' > "${RUNNER_TEMP}/branch-sha" 2> "${RUNNER_TEMP}/branch-error"; then
            if grep -q 'HTTP 404' "${RUNNER_TEMP}/branch-error"; then
              echo "Update branch was already deleted"
              exit 0
            fi
            cat "${RUNNER_TEMP}/branch-error" >&2
            exit 1
          fi
          test "$(cat "${RUNNER_TEMP}/branch-sha")" = "${BUILT_SHA}" || {
            echo "Update branch changed after merging; preserving it" >&2
            exit 1
          }
          git push --force-with-lease="refs/heads/${branch}:${BUILT_SHA}" origin ":refs/heads/${branch}"
