name: Review Lucky Version Update

on:
  workflow_run:
    workflows: [Build OpenWrt APK]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Bot-authored version update PR number
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: review-lucky-${{ github.event.workflow_run.head_sha || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'automation/update-lucky-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Always use the trusted default branch, never the PR checkout or artifacts.
      - name: Checkout review implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test automatic review boundaries
        run: python3 .github/scripts/test_review_lucky_update.py

      - name: Validate and approve version update
        env:
          GH_TOKEN: ${{ github.token }}
          LUCKY_REVIEW_TOKEN: ${{ secrets.LUCKY_REVIEW_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 .github/scripts/review_lucky_update.py
          --pr "${PR_NUMBER}" --head "${EXPECTED_HEAD}" --approve
